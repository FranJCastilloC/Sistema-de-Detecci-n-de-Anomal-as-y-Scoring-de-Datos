# Hyperparameters for the anomaly detection stage.
seed: 42

split:
  train_frac: 0.6
  calibration_frac: 0.2
  # The remaining 20% is the test window; it is scored once, at the end.

autoencoder:
  hidden: [24, 16]
  latent: 8
  dropout: 0.0
  lr: 0.001
  weight_decay: 0.00001
  batch_size: 2048
  max_epochs: 150
  patience: 12
  min_delta: 0.00001
  val_fraction: 0.1
  num_threads: 4

isolation_forest:
  n_estimators: 200
  max_samples: 8192
  max_features: 1.0
  contamination: auto

thresholds:
  review_budget: 0.005
  budget_sweep: [0.001, 0.005, 0.01, 0.02]

evaluation:
  bootstrap_resamples: 200
  seconds_per_review: 90
