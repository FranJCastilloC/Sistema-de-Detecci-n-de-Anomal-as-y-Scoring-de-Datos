name: creditcard_transactions
description: >
  Anonymised card transactions (ULB / Worldline). V1-V28 are PCA components
  released in place of the original features, so the expectations here are
  about structural integrity rather than business meaning.
primary_key: []

outlier_columns: [Amount]
outlier_cut: 5.0

dimension_weights:
  completeness: 0.30
  validity: 0.30
  consistency: 0.10
  uniqueness: 0.15
  plausibility: 0.15

columns:
  - name: Time
    dtype: float
    required: true
    min: 0.0
    description: Seconds elapsed since the first transaction in the file
  - name: V1
    dtype: float
    required: true
    min: -100.0
    max: 100.0
